# ============================================================
# Docker Compose — The Lenny Growth Assistant
# ============================================================
# Three-service stack: PostgreSQL (pgvector), FastAPI, React UI.
# Usage:
#   cp .env.example .env
#   docker compose up --build
# ============================================================

services:
  # --------------------------------------------------------- #
  #  PostgreSQL + pgvector                                     #
  # --------------------------------------------------------- #
  db:
    image: pgvector/pgvector:pg16
    container_name: lenny-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lenny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lenny_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-lenny_growth_assistant}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lenny} -d ${POSTGRES_DB:-lenny_growth_assistant}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------- #
  #  FastAPI Backend                                           #
  # --------------------------------------------------------- #
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lenny-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-lenny}:${POSTGRES_PASSWORD:-lenny_dev_password}@db:5432/${POSTGRES_DB:-lenny_growth_assistant}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app            # Hot-reload in development
      - ./data:/data              # Transcript access for ingestion
    depends_on:
      db:
        condition: service_healthy
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  # --------------------------------------------------------- #
  #  React Frontend (Vite)                                     #
  # --------------------------------------------------------- #
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lenny-frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app           # Hot-reload in development
      - /app/node_modules         # Prevent host node_modules override
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
